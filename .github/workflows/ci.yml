# ============================================================
# CI — CIG-MANUFACTURING v1.1.1
#
# Pipeline quirúrgico que se ejecuta en cada push (cualquier rama) y PR:
#   1. Guardia  → typescript.ignoreBuildErrors (y eslint.ignoreDuringBuilds)
#                 deben estar DESACTIVADOS: las verificaciones del build
#                 tienen que ser reales.
#   2. Guardia  → sin secretos inseguros: el código no puede contener
#                 fallbacks de AUTH_SECRET ni valores publicados.
#   3. Esquema  → prisma validate + prisma generate.
#   4. Lint     → ESLint sobre todo el proyecto.
#   5. Build    → next build con verificación de tipos activa.
#   6. Tipos    → tsc --noEmit (reporta TODOS los errores, no solo el
#                 primero como hace next build).
#   7. Humo     → BD PostgreSQL 16 efímera (servicio contenedor del
#                 runner) + migraciones + semilla + servidor standalone
#                 real: GET /api, login admin, sesión con cookie firmada
#                 y límite de intentos de login (429).
#
# SECRETOS DE CI: AUTH_SECRET y ADMIN_PASSWORD se generan ALEATORIOS en
# cada ejecución (openssl rand) y viajan por GITHUB_ENV — jamás se
# publican valores fijos en el repositorio. La contraseña del
# servicio contenedor de BD existe SOLO dentro del runner efímero
# (localhost, destruido al terminar el job) y no protege nada real.
#
# Versión de Bun fijada a la usada en desarrollo y en la imagen Docker
# (reproducibilidad: mismo runtime en build, pruebas y ejecución).
# ============================================================
name: CI

on:
  # Cualquier rama: sin filtro de branches, el push siempre dispara CI
  push:
  pull_request:
  workflow_dispatch:

# Cancela ejecuciones obsoletas de la misma rama (ahorra minutos)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Privilegios mínimos: solo lectura del código
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3100"
  HOSTNAME: "127.0.0.1"

jobs:
  ci:
    name: "Calidad, tipos, build y humo"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Motor de datos de pruebas: PostgreSQL 16 (igual que producción —
    # docker-compose/postgres:16). Contenedor efímero del runner, solo
    # escucha en localhost del propio runner y se destruye al terminar.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cig_ci
          POSTGRES_PASSWORD: cig_ci_efimera_localrunner
          POSTGRES_DB: cig_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cig_ci -d cig_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Descargar código"
        uses: actions/checkout@v5

      - name: "Instalar Bun 1.3.14"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: "Caché de dependencias de Bun"
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: "Instalar dependencias (lockfile congelado)"
        run: bun install --frozen-lockfile

      # ── 1. GUARDIA DE CONFIGURACIÓN ────────────────────────────
      # Evita que alguien vuelva a ocultar errores del compilador.
      - name: "Guardia: ignoreBuildErrors debe estar desactivado"
        run: |
          if grep -nE 'ignoreBuildErrors[[:space:]]*:[[:space:]]*true' next.config.ts; then
            echo "::error file=next.config.ts,title=ignoreBuildErrors::typescript.ignoreBuildErrors está en true. Elimínalo para que la verificación de tipos del build sea real."
            exit 1
          fi
          if grep -nE 'ignoreDuringBuilds[[:space:]]*:[[:space:]]*true' next.config.ts; then
            echo "::error file=next.config.ts,title=ignoreDuringBuilds::eslint.ignoreDuringBuilds está en true. Elimínalo para que el lint del build sea real."
            exit 1
          fi
          echo "OK: ignoreBuildErrors e ignoreDuringBuilds no están habilitados"

      # ── 2. GUARDIA DE SECRETOS ─────────────────────────────────
      # Evita que un fallback de secreto conocido vuelva al código.
      # La lista negra de valores prohibidos vive POR DISEÑO en
      # seguridad.ts, validar-auth-secret.sh y deploy.sh (para
      # RECHAZARLOS); se excluyen de la búsqueda de presencia.
      # docs/ también se excluye: la documentación de arquitectura
      # cita esos valores como ejemplos de la lista negra (documenta
      # el bloqueo, no usa el secreto). La guardia vigila código.
      - name: "Guardia: sin secretos inseguros en el código"
        run: |
          PROBLEMA=0
          # 1) Fallback con literal: AUTH_SECRET ?? "..." / || "..."
          if grep -rn --include='*.ts' --include='*.tsx' -E 'AUTH_SECRET[[:space:]]*(\?\?|\|\|)[[:space:]]*["'"'"']' src/; then
            echo "::error title=fallback AUTH_SECRET::Fallback de AUTH_SECRET con literal en src/. El secreto debe ser obligatorio."
            PROBLEMA=1
          fi
          # 2) Fallback en orquestación
          if grep -n 'AUTH_SECRET.*:-' docker-compose.yml Dockerfile; then
            echo "::error title=fallback AUTH_SECRET::docker-compose.yml / Dockerfile definen un fallback de AUTH_SECRET."
            PROBLEMA=1
          fi
          # 3) Credenciales fijas publicadas
          if grep -rn --exclude='simulacion-ci.sh' --exclude='ci.yml' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=db --exclude-dir=docs \
            -e 'Admin\*2024' -e 'Ti\*2024' . ; then
            echo "::error title=credencial publicada::Queda una credencial fija publicada en el repositorio (patrones Admin/Ti del 2024)."
            PROBLEMA=1
          fi
          # 4) Secretos de desarrollo históricos usados como valor
          #    (fuera de la lista negra declarada)
          if grep -rn --exclude='seguridad.ts' --exclude='validar-auth-secret.sh' --exclude='deploy.sh' --exclude='simulacion-ci.sh' --exclude='ci.yml' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=db --exclude-dir=.git --exclude-dir=docs \
            -e 'cig-manufacturing-secreto-desarrollo' -e 'fabriflow-secreto-desarrollo' . ; then
            echo "::error title=secreto inseguro::Un secreto de desarrollo histórico se usa como valor (ver arriba)."
            PROBLEMA=1
          fi
          [ "$PROBLEMA" = "0" ] && echo "OK: sin fallbacks de secretos ni credenciales publicadas"

      # ── 3. ESQUEMA ─────────────────────────────────────────────
      - name: "Secretos efímeros aleatorios y BD de pruebas"
        run: |
          # Secretos ALEATORIOS de esta ejecución (nada publicado en el repo).
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          # Política de la semilla: ≥8 caracteres, letra y número.
          echo "ADMIN_PASSWORD=Ci-$(openssl rand -hex 12)" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://cig_ci:cig_ci_efimera_localrunner@127.0.0.1:5432/cig_ci?schema=public" >> "$GITHUB_ENV"
          echo "DATA_DIR=${RUNNER_TEMP}/cig-ci-datos" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/cig-ci-datos"

      - name: "Esquema Prisma (validate + generate)"
        run: |
          bunx prisma validate
          bunx prisma generate

      # ── 4. LINT ────────────────────────────────────────────────
      - name: "Lint (ESLint)"
        run: bun run lint

      # ── 5. BUILD (tipos verificados de verdad) ─────────────────
      - name: "Build de producción"
        run: bun run build

      # ── 6. TYPECHECK COMPLETO ──────────────────────────────────
      # next build se detiene en el primer error; tsc los lista todos.
      - name: "Typecheck completo (tsc --noEmit)"
        run: ./node_modules/.bin/tsc --noEmit

      # ── 7. HUMO (servidor real con BD real) ────────────────────
      - name: "Humo: migraciones + sembrar datos"
        run: |
          bunx prisma migrate deploy
          ADMIN_PASSWORD="$ADMIN_PASSWORD" bun prisma/seed.ts

      - name: "Humo: servidor standalone + API + login + sesión + rate-limit"
        run: |
          NODE_ENV=production bun .next/standalone/server.js > server-ci.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT

          # Esperar el arranque (máx. 60 s)
          listo=0
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:3100/api" > /dev/null; then listo=1; break; fi
            sleep 1
          done
          if [ "$listo" != "1" ]; then
            echo "::error::El servidor standalone no arrancó en 60 s"
            cat server-ci.log
            exit 1
          fi

          # a) API viva
          CUERPO=$(curl -sf "http://127.0.0.1:3100/api")
          echo "GET /api -> $CUERPO"
          echo "$CUERPO" | grep -q 'Hello, world!' \
            || { echo "::error::GET /api no devolvió el cuerpo esperado"; exit 1; }

          # b) Login real contra la BD sembrada (contraseña de pruebas por entorno)
          LOGIN=$(curl -sf -c /tmp/cookies-ci.txt -X POST "http://127.0.0.1:3100/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"correo\":\"admin@cig-manufacturing.com\",\"password\":\"$ADMIN_PASSWORD\"}")
          echo "POST /api/auth/login -> $(echo "$LOGIN" | head -c 200)"
          echo "$LOGIN" | grep -q '"usuario"' \
            || { echo "::error::El login no devolvió un usuario"; exit 1; }

          # c) La cookie de sesión firmada (JWT) autentica
          SESION=$(curl -sf -b /tmp/cookies-ci.txt "http://127.0.0.1:3100/api/auth/sesion")
          echo "GET /api/auth/sesion -> $(echo "$SESION" | head -c 200)"
          echo "$SESION" | grep -q 'admin@cig-manufacturing.com' \
            || { echo "::error::La cookie de sesión no autentica"; exit 1; }

          # d) El login bloquea la fuerza bruta (5 fallos → 429)
          for i in 1 2 3 4 5 6 7; do
            COD=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://127.0.0.1:3100/api/auth/login" \
              -H "Content-Type: application/json" \
              -d "{\"correo\":\"rate-limit@test.local\",\"password\":\"mala-$i\"}")
          done
          [ "$COD" = "429" ] \
            || { echo "::error::El login no aplicó el límite de intentos (esperaba 429, obtuve $COD)"; exit 1; }

          echo "Humo completo: arranque, API, login, sesión y rate-limit OK"

      - name: "Publicar log del servidor (solo si falló)"
        if: failure()
        run: cat server-ci.log 2>/dev/null || true
